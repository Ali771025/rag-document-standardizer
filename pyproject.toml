[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-document-standardizer"
version = "1.0.0"
description = "Local-LLM assisted standardization and governance engine for Persian SQL/Markdown RAG documents"
readme = "README_FA.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "sqlglot>=26,<31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
rag-standardizer = "standardizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["standardizer"]

[tool.hatch.build]
artifacts = ["standardizer/static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>موتور استانداردسازی اسناد RAG</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --panel:#0d1b2d; --line:#203653; --accent:#39d0b2; --text:#edf6ff; --muted:#91a7bf; --bad:#ff7b7b; }
    * { box-sizing:border-box; } body { margin:0; background:radial-gradient(circle at 90% 0,#143552 0,#07111f 42%); color:var(--text); font-family:Tahoma,Arial,sans-serif; }
    main { max-width:1100px; margin:auto; padding:40px 20px 70px; } h1 { margin:0 0 8px; font-size:clamp(26px,4vw,42px); } p { color:var(--muted); line-height:1.8; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:28px; } .card { background:rgba(13,27,45,.95); border:1px solid var(--line); border-radius:18px; padding:20px; box-shadow:0 18px 50px #0005; }
    label { display:block; margin:14px 0 7px; color:#bed0e2; } input,textarea,button { width:100%; border-radius:10px; border:1px solid var(--line); background:#081525; color:var(--text); padding:12px; font:inherit; }
    textarea { min-height:390px; direction:ltr; text-align:left; font-family:Consolas,monospace; resize:vertical; } button { margin-top:16px; background:linear-gradient(90deg,#1e9a86,#39d0b2); color:#04120f; font-weight:bold; border:0; cursor:pointer; }
    button:disabled { opacity:.5; cursor:wait; } pre { white-space:pre-wrap; word-break:break-word; direction:ltr; text-align:left; min-height:440px; color:#d9e8f7; }
    .status { display:inline-flex; gap:8px; align-items:center; border:1px solid var(--line); padding:7px 11px; border-radius:999px; color:var(--muted); } .dot { width:9px; height:9px; border-radius:50%; background:#f6b94b; }
    .ok .dot { background:var(--accent); } .bad .dot { background:var(--bad); } @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <div id="health" class="status"><span class="dot"></span><span>در حال بررسی موتور…</span></div>
  <h1>موتور استانداردسازی اسناد RAG</h1>
  <p>فایل SQL یا Markdown را وارد کنید. خروجی همیشه در وضعیت پیش‌نویس قرار می‌گیرد و برای ورود به RAG به تأیید انسانی نیاز دارد.</p>
  <section class="grid">
    <div class="card">
      <label for="filename">نام فایل</label>
      <input id="filename" value="TINFCommission100.sql">
      <label for="content">محتوای سند</label>
      <textarea id="content" placeholder="محتوای SQL یا Markdown…"></textarea>
      <button id="run">استانداردسازی و کنترل کیفیت</button>
    </div>
    <div class="card">
      <h2>نتیجه ساختاریافته</h2>
      <pre id="result">هنوز سندی پردازش نشده است.</pre>
    </div>
  </section>
</main>
<script>
const health=document.querySelector('#health'), result=document.querySelector('#result'), run=document.querySelector('#run');
async function check(){
  try{const r=await fetch('/healthz'), d=await r.json(); health.className='status '+(d.llm.ok?'ok':'bad'); health.lastChild.textContent=d.llm.ok?`Ollama آماده: ${d.llm.model}`:'موتور آماده؛ LLM محلی در دسترس نیست';}
  catch(e){health.className='status bad';health.lastChild.textContent='API در دسترس نیست';}
}
run.onclick=async()=>{
  run.disabled=true; result.textContent='در حال پردازش…';
  try{
    const r=await fetch('/v1/standardize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:document.querySelector('#filename').value,content:document.querySelector('#content').value})});
    const d=await r.json(); result.textContent=JSON.stringify(d,null,2);
  }catch(e){result.textContent=String(e)}finally{run.disabled=false}
};
check();
</script>
</body>
</html>
